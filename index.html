<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <body>
    <header class="header">
        <h1>My Image Gallery</h1>
        <p>Explore beautiful moments and places</p>
    </header>

    <section class="gallery-section">

        <div class="filters">
            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="nature">
                Nature
            </button>

            <button class="filter-btn" data-filter="travel">
                Travel
            </button>

            <button class="filter-btn" data-filter="city">
                City
            </button>
        </div>

        <div class="gallery">

            <div class="gallery-item" data-category="nature">
                <img src="images/nat 1.jpg" alt="Nature image">
            </div>

            <div class="gallery-item" data-category="travel">
                <img src="images/tra1.jpg" alt="Travel image">
            </div>

            <div class="gallery-item" data-category="city">
                <img src="images/city1.jpg" alt="City image">
            </div>

            <div class="gallery-item" data-category="nature">
                <img src="images/nat2.jpg" alt="Nature image">
            </div>

            <div class="gallery-item" data-category="travel">
                <img src="images/tra2.jpg" alt="Travel image">
            </div>

            <div class="gallery-item" data-category="city">
                <img src="images/city2.jpg" alt="City image">
            </div>

        </div>

    </section>

    <div class="lightbox" id="lightbox">

        <button class="close-btn" id="closeBtn">
            &times;
        </button>

        <button class="prev-btn" id="prevBtn">
            &#10094;
        </button>

        <img class="lightbox-image" id="lightboxImage" src=""  alt="Expanded gallery image" >

        <button class="next-btn" id="nextBtn">
            &#10095;
        </button>

    </div>
    <script src="script.js"></script>
</body>
</html>
